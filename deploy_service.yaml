apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hello
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  strategy: {}
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
      - image: iridescf/hello_app:v2
        name: hello-app
        resources: {}
        livenessProbe:
          tcpSocket:
            port: 32777
          initialDelaySeconds: 15
          periodSeconds: 10
status: {}

---

apiVersion: v1
kind: Service
metadata:
  name: service-hello-app
spec:
  type: NodePort
  selector:
    app: hello
  ports:
    - name: http
      protocol: TCP
      port: 32777
      targetPort: 32777